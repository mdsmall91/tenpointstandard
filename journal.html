<!-- =============================================================
     THE FIELD JOURNAL MOVED TO THE SITE ROOT.

     This file is kept, not deleted, and it is not a stub. It was
     submitted to Search Console and it is the URL in every link
     shared before September 2026. GitHub Pages cannot issue a 301,
     so this is the strongest redirect the platform allows:

       1. A canonical tag pointing at the new URL, which is the
          signal Google actually consolidates on.
       2. A zero-second meta refresh, which Google treats as a
          redirect and which moves a real visitor immediately.
       3. A replace() in script, so the old URL does not pile up in
          the visitor's back button.
       4. A visible link, for anyone the first three miss.

     noindex is deliberately NOT set here. A noindex page cannot pass
     its signals to the canonical target; it would throw away the
     little authority this URL has earned instead of handing it over.
     ============================================================= -->
<link rel="canonical" href="https://tenpointstandard.com/">
<meta http-equiv="refresh" content="0; url=/">
<meta name="robots" content="follow">
<link rel="stylesheet" href="/styles/tokens.css">
<link rel="stylesheet" href="/styles/base.css">
<link rel="stylesheet" href="/styles/pages.css?v=15">
<script>location.replace('/');</script>
</head>

</div>
